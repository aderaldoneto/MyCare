
name: php-laravel

include:
  - path: ./php-laravel/docker-compose.yml

services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - ./front-vuejs:/app
      - frontend_node_modules:/app/node_modules
    environment:
      npm_config_cache: /tmp/.npm
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules:
