services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.2
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: mycare-laravel:8.2
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8000}:80'
      - '${VITE_PORT:-5173}:5173'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mycare

  mysql:
    image: mysql:8.0
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: '${DB_DATABASE:-php_laravel}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-testing-database.sh:/docker-entrypoint-initdb.d/10-testing-database.sh:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-prootsecret']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mycare

networks:
  mycare:
    driver: bridge

volumes:
  mysql-data:
